seed: 123
dataset:
  split: class
  label_num_per_class: 20
  valid_num: 500
  test_num: 1000

gcn:
    epochs: 500
    hidden: 512
    dropout: 0.7
    num_layers: 3
    norm: null
    residual: False

    0.5:
      lr: 0.0006
      weight_decay: 0.000045
      scheduler: False
      warnup: null

      pruner_type: bnscale
      imp_type: group
      isomorphic: True
      prune_step: 2

      prune_lr: 0.000135
      prune_weight_decay: 0.0012
      prune_scheduler: True
      prune_warmup: 0.15

    0.6:
      lr: 0.0015
      weight_decay: 0.004
      scheduler: True
      warnup: 0.4

      pruner_type: group
      imp_type: fpgm
      isomorphic: True
      prune_step: 2

      prune_lr: 0.0066
      prune_weight_decay: 3e-05
      prune_scheduler: True
      prune_warmup: 0.2

    0.7:
      lr: 0.004200517
      weight_decay: 6.53e-05
      scheduler: True
      warnup: 0.5

      pruner_type: base
      imp_type: lamp
      isomorphic: True
      prune_step: 1

      prune_lr: 1.88e-05
      prune_weight_decay: 1.98e-05
      prune_scheduler: False
      prune_warmup: null

sage:
    epochs: 500
    hidden: 256
    dropout: 0.7
    num_layers: 3
    norm: null
    residual: False

    0.5:
      lr: 0.0044
      weight_decay: 0.00037
      scheduler: False
      warnup: null

      pruner_type: base
      imp_type: fpgm
      isomorphic: False
      prune_step: 3

      prune_lr: 8.4e-05
      prune_weight_decay: 5.8e-05
      prune_scheduler: False
      prune_warmup: null


    0.6:
      lr: 0.002
      weight_decay: 0.061
      scheduler: False
      warnup: null

      pruner_type: bnscale
      imp_type: lamp
      isomorphic: False
      prune_step: 1

      prune_lr: 0.0002
      prune_weight_decay: 0.000315
      prune_scheduler: False
      prune_warmup: null

    0.7:
      lr: 0.0026
      weight_decay: 0.0055
      scheduler: False
      warnup: null

      pruner_type: bnscale
      imp_type: fpgm
      isomorphic: False
      prune_step: 1

      prune_lr: 1.25e-05
      prune_weight_decay: 0.1
      prune_scheduler: False
      prune_warmup: null