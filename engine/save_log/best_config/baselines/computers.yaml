seed: 42
dataset:
  split: fixed

sgformer:
  epochs: 1000
  hidden: 64
  dropout: 0.7
  num_heads: 1
  layers : 3
  lr: 0.001
  weight_decay: 5e-5

polynormer:
    epochs: 1200
    g_epochs: 200
    hidden: 64
    dropout: 0.7
    in_dropout: 0.2
    num_heads: 8
    local_layers: 5
    global_layers: 1
    lr: 0.001
    weight_decay: 5e-5
