seed: 42
dataset:
  split: fixed

sgformer:
  epochs: 1000
  hidden: 256
  dropout: 0.7
  num_heads: 1
  layers : 3
  lr: 0.001
  weight_decay: 5e-4

polynormer:
    epochs: 1100
    g_epochs: 100
    hidden: 512
    dropout: 0.5
    in_dropout: 0.5
    num_heads: 1
    local_layers: 7
    global_layers: 2
    lr: 0.001
    weight_decay: 0.0