seed: 42
dataset:
  split: fixed

gcn:
    epochs: 1000
    hidden: 512
    dropout: 0.5
    num_layers: 3
    lr: 0.001
    weight_decay: 5e-5
    norm: layer
    residual: False

sage:
    epochs: 1000
    hidden: 64
    dropout: 0.3
    num_layers: 4
    lr: 0.001
    weight_decay: 5e-5
    norm: layer
    residual: False

gin:
    epochs: 1000
    hidden: 256
    dropout: 0.6
    num_layers: 2
    lr: 0.001
    weight_decay: 5e-4
    norm: layer
    residual: False

cheb:
    epochs: 1000
    hidden: 256
    dropout: 0.8
    num_layers: 3
    lr: 0.001
    weight_decay: 5e-4
    norm: null
    residual: True
    K: 3
